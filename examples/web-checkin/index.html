<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest check-in · VendID MRZ example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Guest check-in</h1>
  <p class="lead">
    Example: a hotel check-in form that fills itself from a passport or ID card, with
    <a href="https://vend-id.com/sdk/docs">VendID <code>mrz.js</code></a>. Plain HTML and JavaScript,
    <a href="https://github.com/kaza/vendid-passport-sdk/tree/main/examples/web-checkin">source on GitHub</a>.
  </p>

  <section class="card">
    <label for="key">Your API key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="vid_…">
    <p class="hint">No key? <a href="https://vend-id.com/sdk#get-key">Get one free in 60 seconds</a>.
      It stays in this browser tab only.</p>

    <div class="buttons">
      <button id="scan" type="button" class="primary">Scan passport (camera)</button>
      <label class="button" for="file">Upload a photo</label>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="specimen" type="button">Try the specimen passport</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <form id="guest" class="card" autocomplete="off">
    <h2>Guest</h2>
    <div class="grid">
      <label>Surname <input name="surname"></label>
      <label>Given names <input name="given_names"></label>
      <label>Date of birth <input name="birth_date" type="date"></label>
      <label>Sex <select name="sex"><option value=""></option><option>F</option><option>M</option><option value="X">X / unspecified</option></select></label>
      <label>Nationality (ICAO code) <input name="nationality" maxlength="3"></label>
      <label>Document type <input name="document_type"></label>
      <label>Document number <input name="document_number"></label>
      <label>Issuing state <input name="issuing_state" maxlength="3"></label>
      <label>Expiry date <input name="expiry_date" type="date"></label>
    </div>
    <h2>Stay</h2>
    <div class="grid">
      <label>Arrival <input name="arrival" type="date"></label>
      <label>Departure <input name="departure" type="date"></label>
      <label class="wide">E-mail <input name="email" type="email"></label>
    </div>
    <p id="expired" class="warn" hidden>This document has expired.</p>
    <button type="submit" class="primary">Check in</button>
    <pre id="out" hidden></pre>
  </form>
</main>

<script src="https://vend-id.com/sdk/mrz.js"></script>
<script src="app.js"></script>
</body>
</html>
